<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#textGrad);
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .dash-line {
        stroke-dasharray: 8 8;
        animation: dash 20s linear infinite;
      }
      .float-node {
        animation: float 4s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines in Background -->
  <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 150,0 L 150,350 M 300,0 L 300,350 M 450,0 L 450,350 M 600,0 L 600,350 M 750,0 L 750,350 M 900,0 L 900,350 M 1050,0 L 1050,350" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Dynamic Background Graphics (Positioned around/behind text without obscuring foreground) -->
  <g stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" class="dash-line" fill="none">
    <path d="M 100,280 Q 300,320 500,270 T 900,290 T 1100,240" />
    <path d="M 50,80 Q 250,40 600,90 T 1150,60" />
  </g>

  <!-- Dynamic Animated Metric Pulse Graphs on Right Side -->
  <g transform="translate(820, 65)" class="float-node">
    <!-- Card Glass background -->
    <rect width="320" height="220" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    
    <!-- Header info inside card -->
    <circle cx="25" cy="30" r="6" fill="#38bdf8"/>
    <text x="40" y="34" class="badge-text">Endpoint Performance Telemetry</text>
    
    <!-- Mini Live Waveform / Chart -->
    <path d="M 25,140 L 60,110 L 95,130 L 130,80 L 165,105 L 200,65 L 235,90 L 270,45 L 295,70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 25,140 L 60,110 L 95,130 L 130,80 L 165,105 L 200,65 L 235,90 L 270,45 L 295,70 L 295,170 L 25,170 Z" fill="url(#textGrad)" opacity="0.15"/>
    
    <!-- Score Pill -->
    <rect x="25" y="172" width="110" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="40" y="191" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">DEX Score: 9.4</text>
    
    <rect x="150" y="172" width="145" height="28" rx="14" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>
    <text x="163" y="191" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Status: Optimized</text>
  </g>

  <!-- Left Side Branding Badges -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="165" height="28" rx="14" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(129, 140, 248, 0.5)" stroke-width="1"/>
    <text x="14" y="18" font-family="sans-serif" font-size="12" font-weight="bold" fill="#818cf8">💻 DEX &amp; EUEM ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND TEXT (Clear, Unobscured & High Contrast) -->
  <text x="60" y="135" class="title">Awesome Endpoint Experience</text>
  <text x="60" y="185" class="title">Management 🚀</text>

  <text x="60" y="232" class="subtitle">Curated Landscape of SaaS Platforms &amp; Open-Source Projects for</text>
  <text x="60" y="258" class="subtitle">Digital Employee Experience (DEX) &amp; Endpoint Telemetry Analytics</text>

  <!-- Bottom Accent Line -->
  <rect x="60" y="295" width="700" height="3" rx="1.5" fill="url(#textGrad)"/>
</svg>
